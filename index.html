<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07142d">
<title>JAI CLUB</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden}
  body{font-family:Arial,Helvetica,sans-serif;background:#07142d;color:#fff}
  .screen{height:100dvh;min-height:560px;overflow:hidden;position:relative;display:flex;flex-direction:column;
    background:radial-gradient(ellipse at 50% 18%,rgba(0,132,255,.34),transparent 42%),
    radial-gradient(ellipse at 90% 100%,rgba(0,74,255,.2),transparent 38%),#07142d}
  .topline{height:5px;background:linear-gradient(90deg,#00d5ff,#1768ff,#8a5cff)}
  header{height:76px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;
    background:rgba(4,15,36,.75);border-bottom:1px solid rgba(100,190,255,.24)}
  .brand{font-weight:1000;font-size:clamp(24px,7vw,34px);letter-spacing:1px;font-style:italic;
    text-shadow:0 0 18px rgba(0,168,255,.45)}
  .brand span{color:#29c8ff}
  .menu{font-size:27px;color:#c9eaff}
  main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:12px 22px 24px;text-align:center}
  .badge{border:1px solid rgba(73,196,255,.55);background:rgba(0,125,255,.12);color:#bceaff;
    border-radius:30px;padding:7px 14px;font-size:11px;font-weight:800;letter-spacing:2px;margin-bottom:18px}
  .emblem{width:88px;height:88px;border-radius:25px;display:grid;place-items:center;margin-bottom:15px;
    background:linear-gradient(145deg,#159cff,#1748e8 60%,#7b45ff);box-shadow:0 12px 38px #006aff55;
    border:1px solid #8bdfff;font-size:39px;font-weight:1000;font-style:italic}
  h1{margin:0;font-size:clamp(39px,11vw,56px);line-height:1;letter-spacing:1px;font-weight:1000;
    text-shadow:0 4px 24px #168dff55}
  h1 span{color:#43cfff}
  .subtitle{font-size:14px;line-height:1.5;color:#b8cbe5;max-width:330px;margin:15px auto 22px}
  .actions{width:100%;max-width:360px;display:grid;gap:12px}
  .btn{min-height:54px;display:flex;align-items:center;justify-content:center;text-decoration:none;
    border-radius:15px;font-size:15px;font-weight:900;letter-spacing:.5px;color:white;
    background:linear-gradient(100deg,#087cff,#2453f4);border:1px solid #69caff;
    box-shadow:0 8px 22px #006cff35}
  .btn.secondary{background:rgba(9,28,60,.82);border:1px solid rgba(90,185,255,.6);box-shadow:none}
  .btn .arrow{margin-left:9px;font-size:18px}
  .foot{margin-top:17px;color:#7892b6;font-size:10px;letter-spacing:1.5px}
  @media(max-height:650px){
    header{height:58px}.emblem{width:64px;height:64px;border-radius:19px;font-size:30px;margin-bottom:10px}
    .badge{margin-bottom:10px} .subtitle{margin:10px auto 14px;font-size:12px}
    .actions{gap:8px}.btn{min-height:45px}.foot{margin-top:10px}
  }
</style>
</head>
<body>
<div class="screen">
  <div class="topline"></div>
  <header>
    <div class="brand">JAI <span>CLUB</span></div>
    <div class="menu" aria-hidden="true">☰</div>
  </header>
  <main>
    <div class="badge">WELCOME TO THE CLUB</div>
    <div class="emblem">J</div>
    <h1>JAI <span>CLUB</span></h1>
    <p class="subtitle">Your community. Your space. Join the JAI CLUB experience.</p>
    <div class="actions">
      <!-- Replace # with your approved non-gambling destination URL -->
      <a class="btn" href="#" data-destination>JOIN NOW <span class="arrow">↗</span></a>
      <a class="btn secondary" href="#" data-destination>ENTER CLUB <span class="arrow">↗</span></a>
      <a class="btn secondary" href="#" data-destination>GET STARTED <span class="arrow">↗</span></a>
    </div>
    <div class="foot">JAI CLUB • OFFICIAL COMMUNITY</div>
  </main>
</div>
<script>
  // Set the same approved destination for every button here:
  const destination = "https://t.me/TEAMANKIT1";
  document.querySelectorAll("[data-destination]").forEach(button => button.href = destination);
</script>
</body>
</html>
